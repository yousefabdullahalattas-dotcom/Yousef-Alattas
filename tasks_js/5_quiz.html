<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 480px;">
    <a href="index.html" class="btn btn-link px-0">&larr; Back</a>
    <h2>Quiz</h2>
    <p class="text-secondary">3 easy questions</p>

    <div class="mb-3">
      <label class="form-label">1) 2 + 2 = ?</label>
      <select id="q1" class="form-select">
        <option value="">-- choose --</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">2) Python file ends with?</label>
      <select id="q2" class="form-select">
        <option value="">-- choose --</option>
        <option value=".txt">.txt</option>
        <option value=".py">.py</option>
        <option value=".html">.html</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">3) 10 / 2 = ?</label>
      <select id="q3" class="form-select">
        <option value="">-- choose --</option>
        <option value="2">2</option>
        <option value="5">5</option>
        <option value="10">10</option>
      </select>
    </div>
    <button id="btn" class="btn btn-primary">Check score</button>
    <div id="out" class="alert alert-info mt-3 d-none"></div>
  </div>

  <script>
    document.getElementById("btn").onclick = function () {
      var score = 0;
      var q1=  document.getElementById("q1").value;
      if (q1 === "4") score += 1;
      if (document.getElementById("q2").value === ".py") score += 1;
      if (document.getElementById("q3").value === "5") score += 1;

      var msg = "Your score: " + score + " / 3";
      if (score === 3) msg += " — Excellent!";
      else if (score >= 1) msg += " — Good";
      else msg += " — Try again";

      var out = document.getElementById("out");
      out.classList.remove("d-none");
      out.textContent = msg;
    };
  </script>
</body>
</html>
