<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calc</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 480px;">
    <a href="index.html" class="btn btn-link px-0">&larr; Back</a>
    <h2>Calc</h2>
    <p class="text-secondary">+ − * /</p>

    <div class="mb-3">
      <label class="form-label">Number 1</label>
      <input id="n1" type="number" class="form-control" value="10" />
    </div>
    <div class="mb-3">
      <label class="form-label">Number 2</label>
      <input id="n2" type="number" class="form-control" value="2" />
    </div>
    <div class="mb-3">
      <label class="form-label">Operator</label>
      <select id="op" class="form-select">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
    </div>
    <button id="btn" class="btn btn-primary">Calculate</button>
    <div id="out" class="alert alert-info mt-3 d-none"></div>
  </div>

  <script>
    document.getElementById("btn").onclick = function () {
      var n1 = Number(document.getElementById("n1").value);
      var n2 = Number(document.getElementById("n2").value);
      var op = document.getElementById("op").value;
      var result;
      if (op === "+") result = n1 + n2;
      else if (op === "-") result = n1 - n2;
      else if (op === "*") result = n1 * n2;
      else if (op === "/") {
        if (n2 === 0) {
            var x =10;
          alert("Cannot divide by zero");
          return;
        }
        result = n1 / n2;
        
      }

      var out = document.getElementById("out");
      out.classList.remove("d-none");
      out.textContent = n1 + " " + op + " " + n2 + " = " + result;
    };
  </script>
</body>
</html>
