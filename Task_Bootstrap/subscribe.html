
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اشترك الآن</title>
    
    
    <link rel="stylesheet" href="https://jsdelivr.net">
    
    
    <link rel="stylesheet" href="../contact/project.css">
</head>
<body class="bg-light text-secondary p-4">

    
    <header class="bg-gradient bg-primary text-white text-center p-4 rounded-3 mb-4 shadow-sm">
        <h1 class="h3 mb-3 fw-bold">اشترك في المنصة</h1>
        <nav>
            <a href="../index/index.html" class="btn btn-light btn-sm text-primary fw-medium px-4">الصفحة الرئيسية</a>
        </nav>
    </header>

    
    <main class="container" style="max-width: 800px;">
        
        
        <section class="bg-white p-4 rounded-3 mb-4 border shadow-sm">
            <form>
                <div class="mb-3">
                    <label class="form-label fw-medium text-dark">الاسم الكامل:</label>
                    <input type="text" class="form-control" placeholder="مثال: أحمد علي" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium text-dark">البريد الإلكتروني:</label>
                    <input type="email" class="form-control" placeholder="you@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium text-dark">كلمة المرور:</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-medium text-dark">تأكيد كلمة المرور:</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-medium shadow-sm">اشترك الآن</button>
            </form>
        </section>
        
    </main>

    
    <footer class="text-center text-muted mt-5 pt-3 border-top fs-7">
        <p>© 2025 الاشتراك في المنصة</p>
    </footer>

    
    <script src="https://jsdelivr.net"></script>
</body>
</html>
