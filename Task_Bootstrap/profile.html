<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي</title>
    
  
    <link rel="stylesheet" href="https://jsdelivr.net">
    

    <link rel="stylesheet" href="../Task_Bootstrap/contact.html">
</head>
<body class="bg-light text-secondary p-4">


    <header class="bg-gradient bg-primary text-white text-center p-4 rounded-3 mb-4 shadow-sm">
        <h1 class="h3 mb-3 fw-bold">الملف الشخصي</h1>
        <nav>
            <a href="../Task_Bootstrap/index.html" class="btn btn-light btn-sm text-primary fw-medium px-4">الصفحة الرئيسية</a>
        </nav>
    </header>

    <main class="container" style="max-width: 800px;">

        <section class="bg-white p-4 rounded-3 mb-4 border shadow-sm text-center">
            <h2 class="h4 text-primary pb-2 mb-4 border-bottom fw-bold text-start">بيانات المستخدم</h2>
            

            <img src="https://media.licdn.com/dms/image/v2/D4D16AQEizR3fndpw5w/profile-displaybackgroundimage-shrink_200_800/profile-displaybackgroundimage-shrink_200_800/0/1723857767205?e=2147483647&v=beta&t=GgRz9EwE-_zm6CGI-n2Z7ogrDjBWiSiZhjP-Avb3Zbs" 
                 alt="صورة المستخدم" class="img-fluid rounded-circle border shadow-sm mb-4" style="width: 150px; height: 150px; object-fit: cover;">
            
            <div class="text-start max-width-500 mx-auto bg-light p-3 rounded-3 border">
                <p class="mb-2 text-dark"><strong>👤 الاسم:</strong> يوسف العطاس</p>
                <p class="mb-2 text-dark"><strong>📧 البريد الإلكتروني:</strong> usef@example.com</p>
                <p class="mb-0 text-dark"><strong>📍 البلد:</strong> السعودية</p>
            </div>
        </section>


        <section class="bg-white p-4 rounded-3 mb-4 border shadow-sm">
            <h2 class="h4 text-primary pb-2 mb-3 border-bottom fw-bold">تحديث بياناتك</h2>
            <form>
                <div class="mb-3">
                    <label class="form-label fw-medium text-dark">الاسم الجديد:</label>
                    <input type="text" class="form-control" placeholder="يوسف العطاس">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium text-dark">البريد الإلكتروني الجديد:</label>
                    <input type="email" class="form-control" placeholder="usef@example.com">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium text-dark">كلمة المرور الجديدة:</label>
                    <input type="password" class="form-control" placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-medium shadow-sm">حفظ التغييرات</button>
            </form>
        </section>
        
    </main>


    <footer class="text-center text-muted mt-5 pt-3 border-top fs-7">
        <p>© 2025 أكاديمية البرمجة</p>
    </footer>


    <script src="https://jsdelivr.net"></script>
</body>
</html>
